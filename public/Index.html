<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Studio IFES</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Variáveis Globais Dinâmicas para Temas */
    :root {
      --bg-main: #0b0f19;
      --bg-card: #121824;
      --bg-input: #0b0f19;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --primary: #10b981;
      --primary-hover: #059669;
    }

    body[data-theme="claro"], body.light-theme {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --primary: #059669;
      --primary-hover: #047857;
    }

    body[data-theme="terroso"] {
      --bg-main: #f4f1ea;
      --bg-card: #ffffff;
      --bg-input: #eae5db;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --border-color: #d6d0c4;
      --primary: #2e6f40;
      --primary-hover: #1e4d2b;
    }

    body {
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .theme-select {
      padding: 8px 12px;
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
    }

    .grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 20px; 
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    
    /* Força todos os cards e containers internos do AVA/Equipes a herdarem o tema ativo */
    .card, .item-box, [class*="card"] {
      background-color: var(--bg-card) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .text-muted {
      color: var(--text-muted) !important;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      background-color: var(--bg-input) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button.btn-action {
      background-color: var(--primary) !important;
      color: #ffffff !important;
      font-weight: bold;
      cursor: pointer;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 5px;
      width: 100%;
    }

    button.btn-action:hover {
      background-color: var(--primary-hover) !important;
    }

    video { 
      width: 100%; 
      height: 180px; 
      background: #000; 
      border-radius: 8px; 
      margin-top: 8px; 
    }
    
    .hidden { display: none; }

    .chat-box {
      height: 140px;
      overflow-y: auto;
      background-color: var(--bg-input) !important;
      border: 1px solid var(--border-color) !important;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>Brain Studio IFES</h1>
    <select class="theme-select" onchange="applyTheme(this.value)">
      <option value="dark">Escuro / Padrão</option>
      <option value="claro">Claro / Gelo</option>
      <option value="terroso">Terroso / Pastel</option>
    </select>
  </div>

  <!-- Autenticação AVA IFES -->
  <div id="login-section" class="card">
    <h2>Login AVA IFES</h2>
    <input type="text" id="username" placeholder="Matrícula/Usuário IFES">
    <input type="password" id="password" placeholder="Senha">
    <button class="btn-action" onclick="loginAVA()">Entrar</button>
  </div>

  <div id="app-section" class="hidden">
    <div class="grid">
      
      <!-- Coluna da Esquerda: Chamadas, Transmissão e Mascote Ajustado -->
      <div>
        <div class="card">
          <h3>Chamadas & Transmissão de Tela</h3>
          <div id="online-list"></div>
          <button class="btn-action" style="margin-top:10px;" onclick="shareScreen()">Compartilhar Tela</button>
          
          <h4 style="margin-top: 15px;">Vídeo da Chamada</h4>
          <video id="localVideo" autoplay muted playsinline></video>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- Card do Mascote Atualizado (Sem Saciedade e Sem Felicidade) -->
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h3 style="margin: 0;">Pipoca</h3>
              <p class="text-muted" style="margin: 4px 0 0 0; font-size: 13px;">
                <span style="background: var(--primary); color: #fff; padding: 2px 8px; border-radius: 10px;">Nv. 2</span> 
                • Estudioso
              </p>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 18px; font-weight: bold; color: var(--primary);">⚡ 39 / 50</span>
              <div class="text-muted" style="font-size: 11px;">ENERGIA</div>
            </div>
          </div>

          <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <span>XP: <strong>100 EXP</strong></span>
            <button class="btn-action" style="width: auto; padding: 6px 12px;" onclick="alert('Abrindo laboratório...')">Laboratório Mascote →</button>
          </div>
        </div>
      </div>

      <!-- Coluna da Direita: AVA IFES, Equipes e Chat Global -->
      <div>
        <!-- Painel do AVA IFES com Sincronização Dinâmica de Cores -->
        <div class="card">
          <h3>Disciplinas AVA IFES</h3>
          <div id="courses-list"></div>
          <div id="course-contents" style="margin-top: 10px;"></div>
        </div>

        <!-- Painel de Equipes -->
        <div class="card">
          <h3>Equipes & Baú de Recompensas (48h)</h3>
          <input type="text" id="team-name" placeholder="Nome da nova equipe">
          <button class="btn-action" onclick="createTeam()">Criar Equipe</button>
          
          <div id="teams-list" style="margin-top: 15px;"></div>
        </div>

        <!-- Chat Global -->
        <div class="card">
          <h3>Chat Global</h3>
          <div id="chat-box" class="chat-box"></div>
          <input type="text" id="chat-input" placeholder="Digite sua mensagem...">
          <button class="btn-action" onclick="sendChatMessage()">Enviar</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();
    let peerConnection;
    let localStream;
    let userToken = '';
    let currentUsername = '';

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // Sincronização de Temas Globais
    function applyTheme(themeName) {
      document.body.setAttribute('data-theme', themeName);
      if (themeName === 'claro') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
      localStorage.setItem('brain_studio_theme', themeName);
    }

    // Carregar Tema Salvo
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('brain_studio_theme') || 'dark';
      document.querySelector('.theme-select').value = savedTheme;
      applyTheme(savedTheme);
    });

    // Autenticação no AVA IFES
    async function loginAVA() {
      currentUsername = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUsername, password })
      });

      const data = await res.json();
      if (data.token) {
        userToken = data.token;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');

        socket.emit('register_user', { username: currentUsername });
        loadCourses();
      } else {
        alert('Falha ao autenticar no AVA IFES.');
      }
    }

    // --- WEBRTC & MÍDIA ---
    async function setupMedia(screen = false) {
      if (screen) {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } else {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      }
      document.getElementById('localVideo').srcObject = localStream;
    }

    async function startCall(targetSocketId) {
      await setupMedia(false);

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice_candidate', { targetSocketId, candidate: event.candidate });
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('call_user', { targetSocketId, offer });
    }

    socket.on('incoming_call', async ({ fromSocketId, offer }) => {
      if (!confirm("Atender chamada de vídeo?")) return;

      await setupMedia(false);
      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice_candidate', { targetSocketId: fromSocketId, candidate: event.candidate });
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      socket.emit('answer_call', { targetSocketId: fromSocketId, answer });
    });

    socket.on('call_accepted', async ({ answer }) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('ice_candidate', async ({ candidate }) => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    });

    async function shareScreen() {
      if (!peerConnection) return alert("Inicie uma chamada antes de compartilhar a tela.");
      await setupMedia(true);
      const videoTrack = localStream.getVideoTracks()[0];
      const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
      if (sender) sender.replaceTrack(videoTrack);
    }

    // --- SOCKETS, EQUIPES E CHAT ---
    socket.on('online_users_list', (users) => {
      const list = document.getElementById('online-list');
      list.innerHTML = users
        .filter(u => u.username !== currentUsername)
        .map(u => `<div class="item-box" style="display:flex; justify-content:space-between; align-items:center;">
            <span>🟢 ${u.username}</span> 
            <button class="btn-action" style="width:auto;" onclick="startCall('${u.socketId}')">Ligar</button>
          </div>`)
        .join('');
    });

    socket.on('sync_initial_state', ({ teams, messages }) => {
      renderTeams(teams);
      renderMessages(messages);
    });

    socket.on('teams_updated', renderTeams);
    
    socket.on('new_chat_message', (msg) => {
      const box = document.getElementById('chat-box');
      box.innerHTML += `<p style="margin: 4px 0;"><strong>${msg.user}:</strong> ${msg.text}</p>`;
      box.scrollTop = box.scrollHeight;
    });

    socket.on('reward_status', res => alert(res.message));

    function createTeam() {
      const name = document.getElementById('team-name').value;
      if (name) {
        socket.emit('create_team', { name, creator: currentUsername });
        document.getElementById('team-name').value = '';
      }
    }

    function donateXp(teamId) {
      socket.emit('donate_team_xp', { teamId, xpAmount: 5000 });
    }

    function claimReward(teamId) {
      socket.emit('claim_team_reward', { teamId });
    }

    function renderTeams(teams) {
      const container = document.getElementById('teams-list');
      container.innerHTML = teams.map(t => `
        <div class="item-box">
          <strong>${t.name}</strong><br>
          <span class="text-muted">XP: ${t.xp}/${t.requiredXp}</span>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn-action" onclick="donateXp('${t.id}')">Doar 5000 XP</button>
            <button class="btn-action" onclick="claimReward('${t.id}')">Abrir Baú (48h)</button>
          </div>
        </div>
      `).join('');
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      if (input.value) {
        socket.emit('send_chat_message', { user: currentUsername, text: input.value });
        input.value = '';
      }
    }

    function renderMessages(messages) {
      document.getElementById('chat-box').innerHTML = messages
        .map(m => `<p style="margin: 4px 0;"><strong>${m.user}:</strong> ${m.text}</p>`).join('');
    }

    // --- CARREGAR DISCIPLINAS AVA IFES ---
    async function loadCourses() {
      const res = await fetch(`/api/courses?token=${userToken}&userid=0`);
      const courses = await res.json();
      const container = document.getElementById('courses-list');
      if (Array.isArray(courses)) {
        container.innerHTML = courses.map(c => `
          <div class="item-box" style="cursor:pointer;" onclick="loadContents('${c.id}')">
            📘 <strong>${c.fullname}</strong>
          </div>
        `).join('');
      }
    }

    async function loadContents(courseId) {
      const res = await fetch(`/api/course-contents?token=${userToken}&courseid=${courseId}`);
      const contents = await res.json();
      const container = document.getElementById('course-contents');
      if (Array.isArray(contents)) {
        container.innerHTML = contents.map(s => `
          <div class="item-box">📌 <strong>${s.name}</strong></div>
        `).join('');
      }
    }
  </script>
</body>
</html>
